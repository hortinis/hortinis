name: hortinis

services:
  postgres:
    image: postgres:18.0
    environment:
      POSTGRES_DB: hortinis
      POSTGRES_USER: hortinis
      POSTGRES_PASSWORD: ${HORTINIS_POSTGRES_PASSWORD:?Set HORTINIS_POSTGRES_PASSWORD before starting Compose}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U hortinis -d hortinis
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 10s

  gradle-cache-init:
    image: gradle:9.7.1-jdk25
    user: "0:0"
    entrypoint: ["bash", "/initialize-gradle-cache.sh"]
    command: ["${HORTINIS_UID:-0}", "${HORTINIS_GID:-0}"]
    volumes:
      - ./initialize-gradle-cache.sh:/initialize-gradle-cache.sh:ro
      - gradle-cache:/home/gradle/.gradle

  sync:
    image: gradle:9.7.1-jdk25
    user: "${HORTINIS_UID:-0}:${HORTINIS_GID:-0}"
    entrypoint: []
    init: true
    working_dir: /workspace
    command:
      - gradle
      - :services:sync:bootRun
      - --no-daemon
    environment:
      GRADLE_USER_HOME: /home/gradle/.gradle
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hortinis
      SPRING_DATASOURCE_USERNAME: hortinis
      SPRING_DATASOURCE_PASSWORD: ${HORTINIS_POSTGRES_PASSWORD:?Set HORTINIS_POSTGRES_PASSWORD before starting Compose}
    depends_on:
      gradle-cache-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../..:/workspace
      - gradle-cache:/home/gradle/.gradle
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          response="$$(cat <&3)"
          grep -q '^HTTP/1.1 200 ' <<<"$$response"
          grep -q '"status":"UP"' <<<"$$response"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 180s
    stop_grace_period: 10s

volumes:
  gradle-cache:
  postgres-data:
