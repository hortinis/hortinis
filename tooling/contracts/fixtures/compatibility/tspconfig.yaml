kind: project
entrypoint: main.tsp
emit:
  - "@typespec/openapi3"
  - "@typespec/json-schema"
options:
  "@typespec/openapi3":
    file-type: yaml
    new-line: lf
    openapi-versions:
      - "3.1.0"
    output-file: probe.openapi.yaml
    seal-object-schemas: true
  "@typespec/json-schema":
    file-type: json
    seal-object-schemas: true
