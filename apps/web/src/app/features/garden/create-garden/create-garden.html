<h2 mat-dialog-title>Créer un jardin</h2>
<form [formGroup]="garden">
  <mat-dialog-content>
    <div class="field">
      <mat-label for="name">Nom</mat-label>
      <mat-form-field>
        <input matInput id="name" [formControl]="garden.controls.name" />
      </mat-form-field>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton="text">Cancel</button>
    <button matButton="filled">Create garden</button>
  </mat-dialog-actions>
</form>
