<h2 mat-dialog-title>Créer un jardin</h2>
<form [formRoot]="gardenForm">
  <mat-dialog-content>
    <div class="field">
      <mat-label for="name">Nom</mat-label>
      <mat-form-field>
        <input matInput id="name" [formField]="gardenForm.name" />
        @for (error of gardenForm.name().errors(); track error) {
          <mat-error>{{ error.message }}</mat-error>
        }
      </mat-form-field>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton="outlined">Annuler</button>
    <button matButton="filled" type="submit">Créer</button>
  </mat-dialog-actions>
</form>
