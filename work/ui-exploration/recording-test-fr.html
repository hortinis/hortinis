    <div class="status" role="status" aria-live="polite"></div>
    <div class="context-bar" role="group" aria-label="Période et météo"><button type="button" class="period-trigger" aria-expanded="false"><i data-lucide="calendar-days" aria-hidden="true"></i><span>Aujourd’hui</span><i class="small-chevron" data-lucide="chevron-down" aria-hidden="true"></i></button><button type="button" class="weather-trigger"><i data-lucide="cloud-sun" aria-hidden="true"></i><span>8° · 2–14°</span></button></div>
    <nav aria-label="Navigation principale">${[['house','Accueil'],['sprout','Jardin'],['plus','Noter'],['calendar-days','Planifier'],['notebook-pen','Journal']].map(([icon,label],i)=>`<button type="button" data-nav="${i}" ${i===0?'aria-current="page"':''} ${i===2?'class="dock-add" aria-label="Noter un événement"':''}><i data-lucide="${icon}" aria-hidden="true"></i><span>${label}${i===3?' <span class="badge" aria-label="Une suggestion">1</span>':''}</span></button>`).join('')}</nav>
    <section class="sheet period-sheet" hidden aria-label="Choisir une période"><div class="sheet-head"><strong>Afficher les tâches</strong><button data-close type="button" aria-label="Fermer">×</button></div><div class="period-choices">${Object.entries(periods).map(([key,p])=>`<button type="button" data-period="${key}" aria-pressed="${key==='today'}"><span>${p[0]}</span><small>${p[1]}</small></button>`).join('')}</div></section>
    <section class="sheet info" hidden aria-label="Détails"><div class="sheet-head"><strong></strong><button data-close type="button" aria-label="Fermer">×</button></div><p></p></section>
  </div></section>`;
  const q=s=>root.querySelector(s),all=s=>[...root.querySelectorAll(s)];
  const announce=text=>q('.status').textContent=text;
  const current=e=>e.revisions[e.revisions.length-1];
  function inPeriod(t){return period==='today'?t.date!==null&&t.date<=today:period==='undated'?t.date===null:t.date>=periods[period][2]&&t.date<=periods[period][3];}
  function payload(action,target,exclude=false){return {action,target,exclude,date:today,amount:'',unit:'',notes:'',observation:'',voided:false};}
  function createEvent(data,taskId=null){const id=nextId++;events.set(id,{id,taskId,revisions:[{...data}]});if(taskId!==null)completed.set(taskId,id);return id;}
  function feedback(id,message){lastId=id;lastMessage=message;announce(message);}
  function taskRow(t){const done=completed.has(t.id),late=!done&&t.date<today;
    const label=`<label class="task ${late?'overdue':''}"><input type="checkbox" data-task="${t.id}" aria-label="${done?'Annuler la réalisation de':'Terminer'} : ${esc(t.label)}" ${done?'checked':''}><span class="action-icon" aria-hidden="true"><i data-lucide="${t.icon}"></i></span><span class="words"><strong>${esc(t.label)}</strong>${t.exclude?'<small>Sauf la serre</small>':''}${late?`<small class="late">En retard · prévu le ${dateLabel(t.date)}</small>`:''}</span></label>`;
    return done?`<div class="completed-row">${label}<button type="button" class="text-action" data-edit="${completed.get(t.id)}" aria-label="Modifier le travail enregistré : ${esc(t.label)}">Détails</button></div>`:label;
  }
  function revisionText(data){const quantity=data.amount===''?'Quantité inconnue':`${data.amount}${data.unit?' '+data.unit:' · unité non précisée'}`;
    return `${dateLabel(data.date)} · ${data.target}${data.exclude?' · sauf la serre':''}\n${quantity}${data.observation?'\n'+data.observation:''}${data.notes?'\n'+data.notes:''}`;
  }
  function renderJournal(){
    const list=[...events.values()].reverse();
    q('.journal-list').innerHTML=list.length?list.map(e=>{const data=current(e);return `<article class="journal-entry ${data.voided?'voided':''}"><h4>${esc(data.action)}${data.voided?' · Annulé':''}</h4><p>${esc(revisionText(data))}</p><span class="entry-meta">${e.taskId!==null?'Lié à une tâche':'Saisie directe'}${e.revisions.length>1?' · Modifié':''}</span>${data.voided?'':`<div><button type="button" class="text-action" data-edit="${e.id}">Modifier les détails</button></div>`}<details><summary>Historique · ${e.revisions.length} ${e.revisions.length>1?'étapes':'étape'}</summary>${e.revisions.map((r,i)=>`<div class="revision"><span class="entry-meta">${i===0?'Saisie initiale':r.voided?'Annulation':'Correction'}</span><p>${esc(revisionText(r))}</p></div>`).join('')}</details></article>`;}).join(''):'<p class="empty">Aucun événement enregistré. Terminez une tâche ou utilisez « Noter ».</p>';
  }
  function render(){
    const visible=tasks.filter(inPeriod),pending=visible.filter(t=>!completed.has(t.id)),done=visible.filter(t=>completed.has(t.id));
    q('.period-title').textContent=periods[period][1];q('.count').textContent=pending.length;
    q('.period-trigger span').textContent=periods[period][0];
    q('.weather-trigger span').textContent=period==='today'?'8° · 2–14°':period==='tomorrow'?'5–16°':'Météo —';
    q('.task-area').innerHTML=['Jardin','Planche est','Planche ouest','Serre'].map((place,i)=>{const group=pending.filter(t=>t.place===place);if(!group.length)return '';return `<details class="place-panel" data-place="${place}" ${collapsed.has(place)?'':'open'}><summary><span class="place-icon"><i data-lucide="${['trees','rows-3','rows-3','house'][i]}" aria-hidden="true"></i></span><span class="place-name">${place}</span><span class="place-count">${group.length}</span><i class="chevron" data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="tasks">${group.map(taskRow).join('')}</div></details>`;}).join('')||'<p class="empty">Aucune tâche restante pour cette période.</p>';
    all('.place-panel').forEach(panel=>panel.addEventListener('toggle',()=>{if(!panel.isConnected)return;panel.open?collapsed.delete(panel.dataset.place):collapsed.add(panel.dataset.place);}));
    q('.done').hidden=!done.length;q('.done summary span').textContent=done.length;q('.done div').innerHTML=done.map(taskRow).join('');
    q('.completion-feedback').hidden=lastId===null||view==='editor';q('.feedback-top strong').textContent=lastMessage;
    if(lastId!==null){const voided=current(events.get(lastId)).voided;q('.feedback-actions').hidden=voided;}
    q('.home-view').hidden=view!=='home';q('.journal-view').hidden=view!=='journal';q('.editor-view').hidden=view!=='editor';q('.context-bar').hidden=view!=='home';
    q('.phone').classList.toggle('is-editor',view==='editor');q('.phone').classList.toggle('is-journal',view==='journal');
    all('[data-nav]').forEach(button=>{const active=(view==='home'&&button.dataset.nav==='0')||(view==='journal'&&button.dataset.nav==='4')||(view==='editor'&&button.dataset.nav==='2');if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
    renderJournal();if(globalThis.lucide)lucide.createIcons();
  }
  function undo(id){const e=events.get(id);if(!e||current(e).voided)return;e.revisions.push({...current(e),voided:true});if(e.taskId!==null)completed.delete(e.taskId);feedback(id,e.taskId!==null?'Réalisation annulée · tâche rouverte':'Saisie annulée');render();}
  function closeSheets(){all('.sheet').forEach(el=>el.hidden=true);q('.period-trigger').setAttribute('aria-expanded','false');}
  function info(title,text){closeSheets();q('.info strong').textContent=title;q('.info p').textContent=text;q('.info').hidden=false;}
  function readForm(){return {action:q('[name="action"]').value,target:q('[name="target"]').value,exclude:!q('.exclusion').hidden&&q('[name="exclude"]').checked,date:q('[name="date"]').value,amount:q('[name="amount"]').value,unit:q('[name="unit"]').value,notes:q('[name="notes"]').value,observation:q('[name="action"]').value==='Observation'?q('[name="observation"]').value:'',voided:false};}
  function setTargets(preferred){const action=q('[name="action"]').value;const options=action==='Récolte'?['Radis · Planche est','Tomates · Serre']:['Tout le jardin','Planche est','Planche ouest','Serre','Tomates · Serre','Radis · Planche est'];q('[name="target"]').innerHTML=options.map(target=>`<option>${target}</option>`).join('');q('[name="target"]').value=options.includes(preferred)?preferred:options[0];updateFields();}
  function updateFields(){const action=q('[name="action"]').value;q('.observation').hidden=action!=='Observation';q('[name="observation"]').required=action==='Observation';q('.field-pair').hidden=action==='Observation';q('.exclusion').hidden=q('[name="target"]').value!=='Tout le jardin';}
  function openEditor(id=null,expand=true){
    closeSheets();returnView=view==='journal'?'journal':'home';editingId=id;
    const data=id===null?editorDraft??payload('Arrosage','Tout le jardin'):current(events.get(id));
    q('.editor').reset();q('.form-error').hidden=true;q('.editor-view h3').textContent=id===null?'Noter un événement':'Détails du travail';
    q('.editor-note').textContent=id===null?'La date et les détails peuvent rester inconnus.':'La réalisation est déjà enregistrée. Fermer laisse les valeurs actuelles intactes.';
    q('[name="action"]').value=data.action;setTargets(data.target);
    q('[name="action"]').disabled=id!==null;
    q('[name="target"]').disabled=id!==null&&events.get(id).taskId!==null;
    for(const name of ['date','amount','unit','notes','observation'])q(`[name="${name}"]`).value=data[name];
    q('[name="exclude"]').checked=Boolean(data.exclude);q('.optional-fields').open=expand;
    q('.submit').textContent=id===null?'Enregistrer':'Enregistrer les détails';view='editor';render();q('[name="action"]').focus();
  }
  function cancelEditor(){if(editingId===null)editorDraft=readForm();view=returnView;editingId=null;render();q('[data-nav="2"]').focus();}
  root.addEventListener('change',event=>{
    if(!event.target.matches('[data-task]'))return;
    const t=tasks.find(t=>t.id===Number(event.target.dataset.task));
    if(!event.target.checked){undo(completed.get(t.id));return;}
    if(completed.has(t.id))return;
    const id=createEvent(payload(t.action,t.target,Boolean(t.exclude)),t.id);feedback(id,`${t.action} enregistré · ${dateLabel(today)}`);render();
    const next=q('.task-area [data-task]');if(next)next.focus();else q('.done summary').focus();
  });
  root.addEventListener('click',event=>{const edit=event.target.closest('[data-edit]');if(edit)openEditor(Number(edit.dataset.edit),true);});
  q('.feedback-details').addEventListener('click',()=>openEditor(lastId,true));q('.feedback-undo').addEventListener('click',()=>undo(lastId));q('.dismiss-feedback').addEventListener('click',()=>{lastId=null;render();});
  q('.cancel-editor').addEventListener('click',cancelEditor);
  q('[name="action"]').addEventListener('change',()=>setTargets(q('[name="target"]').value));q('[name="target"]').addEventListener('change',updateFields);
  q('.editor').addEventListener('submit',event=>{
    event.preventDefault();const data=readForm();
    if(data.action==='Observation'&&!data.observation.trim()){q('.form-error').textContent='Décrivez ce que vous avez constaté.';q('.form-error').hidden=false;return;}
    let id=editingId;
    if(id===null){id=createEvent(data);editorDraft=null;feedback(id,`${data.action} enregistré · ${dateLabel(data.date)}`);}
    else {const e=events.get(id);if(JSON.stringify(data)!==JSON.stringify(current(e)))e.revisions.push({...data});feedback(id,'Détails enregistrés · même événement');}
    view=returnView;editingId=null;render();q('.feedback-details').focus();
  });
  all('[data-nav]').forEach(button=>button.addEventListener('click',()=>{
    const key=button.dataset.nav;
    if(view==='editor'&&key!=='2'){cancelEditor();}
    if(key==='2'){if(view!=='editor')openEditor(null,false);return;}
    closeSheets();if(key==='0'||key==='4'){view=key==='0'?'home':'journal';render();return;}
    info(key==='1'?'Jardin':'Planification',key==='1'?'La navigation complète sera explorée séparément.':'Une idée à planifier : préparer la culture qui suivra les radis.');
  }));
  all('[data-close]').forEach(button=>button.addEventListener('click',closeSheets));
  q('.period-trigger').addEventListener('click',()=>{const open=q('.period-sheet').hidden;closeSheets();q('.period-sheet').hidden=!open;q('.period-trigger').setAttribute('aria-expanded',String(open));});
  all('[data-period]').forEach(button=>button.addEventListener('click',()=>{period=button.dataset.period;all('[data-period]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));closeSheets();render();announce(`${periods[period][1]} : ${q('.count').textContent} tâches restantes.`);}));
  q('.weather-trigger').addEventListener('click',()=>info('Météo · données fictives',period==='today'?'12 avril : 8 °C à 8 h. Minimum 2 °C, maximum 14 °C. Pluie : 10 %. Vent : 12 km/h.':period==='tomorrow'?'13 avril : minimum 5 °C, maximum 16 °C. Prévision fictive.':'Aucune prévision disponible pour cette période.'));
  q('.garden-alert').addEventListener('click',()=>info('Potager partagé','Un risque de froid est signalé pour ce soir.'));
  q('header select').addEventListener('change',event=>{event.target.selectedIndex=0;info('Jardin de démonstration','Les interactions de cette maquette concernent le jardin maison.');});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){if(view==='editor')cancelEditor();else closeSheets();}});
  render();
  if(globalThis.Tweak){const state={height:54};new Tweak({container:q('.phone'),onChange:()=>q('.phone').style.setProperty('--task-height',state.height+'px')}).addSlider(state,'height',{label:'Hauteur des tâches',min:48,max:64,step:2,unit:'px'});}
})();
</script>
</div>
