<div id="garden-selection" lang="fr">
<style>
#garden-selection{color-scheme:light dark;--paper:light-dark(#fffef9,#1e2c24);--page:light-dark(#f3f1e7,#15221a);--ink:light-dark(#293c30,#e2eee5);--muted:light-dark(#616f63,#b7c6ba);--line:light-dark(#d7dfd1,#455448);--green:light-dark(#306c45,#aedbb8);--on:light-dark(#fff,#193321);--soft:light-dark(#e2ebd9,#304730);--soil:light-dark(#e8dccb,#514332);--path:light-dark(#dad5c6,#494638);font:14px/1.4 system-ui,sans-serif;color:var(--ink);max-width:820px;margin:auto}
#garden-selection *{box-sizing:border-box}#garden-selection [hidden]{display:none!important}#garden-selection button,#garden-selection input,#garden-selection select{font:inherit;color:inherit}#garden-selection button{min-height:44px;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 12px;cursor:pointer}#garden-selection button[aria-pressed=true]{border-color:var(--green);background:var(--soft)}#garden-selection .primary{background:var(--green);color:var(--on);border-color:var(--green)}#garden-selection .app{background:var(--page);border:1px solid var(--line);border-radius:18px;overflow:hidden}#garden-selection header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--paper);gap:8px}#garden-selection h1,#garden-selection h2{font-family:Georgia,serif;font-weight:500;margin:0;font-size:22px}#garden-selection small{font-size:12px;color:var(--muted)}#garden-selection .temporal{padding:8px 12px;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#garden-selection .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}#garden-selection .periods{display:flex;gap:3px;flex:1}#garden-selection .periods button{border:0;padding:7px 9px}#garden-selection .date-row{display:flex;align-items:center;gap:8px;margin-top:6px}#garden-selection .date-row input{min-width:0;flex:1;accent-color:var(--green)}#garden-selection output{min-width:140px;text-align:center;font-weight:500}#garden-selection .crumbs{display:flex;gap:4px;align-items:center;min-height:48px;padding:0 10px;flex-wrap:wrap}#garden-selection .crumbs button{border:0;background:none;padding:6px;font-size:13px}#garden-selection .canvas-wrap{padding:0 12px 12px}#garden-selection .canvas{height:330px;position:relative;background:var(--soft);border:1px solid var(--line);border-radius:22px 10px 18px 10px;overflow:hidden}#garden-selection .walk{position:absolute;left:47%;width:10%;height:110%;top:-4%;background:var(--path);transform:rotate(3deg)}#garden-selection .plot{position:absolute;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:5px;border:1px solid var(--green);border-radius:10px;padding:10px;background:var(--paper)}#garden-selection .plot strong{font-weight:500}#garden-selection .plot span{font-size:12px}#garden-selection .plot[data-pick=east]{left:5%;top:8%;width:38%;height:38%}#garden-selection .plot[data-pick=west]{left:5%;top:55%;width:38%;height:35%;background:var(--soil)}#garden-selection .plot[data-pick=greenhouse]{left:61%;top:8%;width:34%;height:45%;border-radius:30px 30px 8px 8px}#garden-selection .plot[data-pick=fallow]{left:61%;top:63%;width:34%;height:27%;background:var(--soft);border-style:dashed}#garden-selection .badge{color:var(--green);font-size:12px}#garden-selection .crop{position:absolute;left:8%;top:16%;width:63%;height:64%;border:2px dashed var(--green);background:var(--soft);text-align:left;padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:center}#garden-selection .crop.real{border-style:solid}#garden-selection .vacant{position:absolute;right:5%;width:20%;top:20%;height:56%;display:flex;align-items:center;text-align:center;font-size:12px;color:var(--muted);border:1px dashed var(--green);border-radius:8px;padding:5px}#garden-selection .drawing{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#garden-selection .drawing.active{pointer-events:auto;touch-action:none;cursor:crosshair}#garden-selection .drawing path{fill:color-mix(in srgb,var(--green) 15%,transparent);stroke:var(--green);stroke-width:2;vector-effect:non-scaling-stroke}#garden-selection .tools{display:flex;gap:7px;margin-top:8px;align-items:center;flex-wrap:wrap}#garden-selection .tools small{margin-left:auto}#garden-selection .sheet{padding:15px 16px;background:var(--paper);border-top:1px solid var(--line);min-height:190px}#garden-selection .stats{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0}#garden-selection .stats strong{display:block;font-size:21px;font-weight:500}#garden-selection .stats span{font-size:12px;color:var(--muted)}#garden-selection .meter{display:flex;height:7px;border-radius:5px;overflow:hidden;background:var(--soft);margin:10px 0}#garden-selection .meter i{background:var(--green);width:50%}#garden-selection .meter b{background:var(--soil);width:16.667%}#garden-selection .note{color:var(--muted);margin:8px 0 12px;font-size:13px}#garden-selection .sheet .row{margin-top:10px}#garden-selection label{display:block;margin:10px 0;font-size:13px}#garden-selection select,#garden-selection input[type=text]{display:block;width:100%;min-height:44px;background:var(--paper);border:1px solid var(--line);padding:8px;border-radius:8px;font-size:16px}#garden-selection .feedback{background:var(--soft);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}#garden-selection .feedback:empty{display:none}#garden-selection footer{padding:8px 12px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}#garden-selection .selected{outline:2px solid var(--green);outline-offset:2px}#garden-selection .task{padding:8px 0;border-top:1px solid var(--line)}
@media(min-width:650px){#garden-selection .canvas{height:365px}#garden-selection .sheet{padding:18px 24px}#garden-selection .plot strong{font-size:18px}}@media(max-width:380px){#garden-selection header{padding:10px}#garden-selection h1{font-size:20px}#garden-selection .plot{padding:7px}#garden-selection .canvas{height:310px}#garden-selection .stats{gap:15px}#garden-selection output{min-width:130px}#garden-selection .date-row{gap:3px}}
</style>
<section class="app" aria-label="Plan du jardin — nouvelle proposition">
<header><h1>Jardin maison</h1><small>Planifier · Hors ligne</small></header>
<div class="temporal"><div class="periods"><button data-period="-30">Passé</button><button data-period="0" aria-pressed="true">Aujourd’hui</button><button data-period="30">Futur</button></div><div class="date-row"><button data-step="-1" aria-label="Jour précédent">‹</button><output id="selection-date"></output><button data-step="1" aria-label="Jour suivant">›</button><input type="range" min="-60" max="90" value="0" aria-label="Explorer le temps"></div></div>
<nav class="crumbs" aria-label="Sélection"></nav>
<div class="canvas-wrap"><div class="canvas"><div class="map-content"></div><svg class="drawing" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Surface de dessin"><path></path></svg></div><div class="tools"><button class="primary" id="selection-draw">Dessiner</button><label id="assist-label" hidden><input type="checkbox" id="selection-assist" checked> Tracé assisté</label><button id="selection-cancel" hidden>Annuler</button><small id="map-caption">Touchez un espace</small></div></div>
<section class="sheet" aria-label="Détails de la sélection"></section>
<div class="feedback" role="status" aria-live="polite"></div>
<footer>Maquette de discussion · données fictives · modifications temporaires</footer>
</section>
<script>
(()=>{
const root=document.getElementById('garden-selection'),q=s=>root.querySelector(s),all=s=>[...root.querySelectorAll(s)];
let selection='garden',day=0,confirmed=false,drawing=false,points=[],draft=null,added=[],previous=null;
const names={garden:'Jardin',east:'Planche est',west:'Planche ouest',greenhouse:'Serre',fallow:'Jachère',crop:'Laitues'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,primary=false)=>`<button data-action="${action}" class="${primary?'primary':''}">${label}</button>`;
const stats=items=>'<div class="stats">'+items.map(([value,label])=>`<div><strong>${value}</strong><span>${label}</span></div>`).join('')+'</div>';
function feedback(message,undo=false){q('.feedback').innerHTML=`<span>${esc(message)}</span>${undo?button('Annuler','undo'):''}`;}
function planned(){return day>=0&&!confirmed;}
function render(){
q('.drawing').querySelectorAll('path:not(:first-child)').forEach(p=>p.remove());
const date=new Date(Date.UTC(2026,8,15+day));q('output').textContent=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(date);q('input[type=range]').value=day;
all('[data-period]').forEach(b=>b.setAttribute('aria-pressed',String(day<0?b.dataset.period==='-30':day>0?b.dataset.period==='30':b.dataset.period==='0')));
q('.crumbs').innerHTML=`<button data-pick="garden">Jardin maison</button>${selection!=='garden'?`<span>›</span><button data-pick="${selection==='crop'?'east':selection}">${names[selection==='crop'?'east':selection]}</button>`:''}${selection==='crop'?'<span>›</span><span>Laitues</span>':''}`;
let cropLabel=day<0?'Radis':confirmed?'Laitues · en place':'Laitues · prévues';
if(selection==='garden')q('.map-content').innerHTML=`<div class="walk"></div><button class="plot" data-pick="east"><strong>Planche est</strong><span>${cropLabel}</span><span class="badge">${day<0?'1 tâche':'2 tâches'}</span></button><button class="plot" data-pick="west"><strong>Planche ouest</strong><span>Sol travaillé</span><span>Disponible</span></button><button class="plot" data-pick="greenhouse"><strong>Serre</strong><span>Tomates en place</span><span class="badge">1 tâche</span></button><button class="plot" data-pick="fallow"><strong>Jachère</strong><span>Repos du sol</span></button>`;
else if(selection==='east'||selection==='crop')q('.map-content').innerHTML=`<button class="crop ${planned()?'':'real'} ${selection==='crop'?'selected':''}" data-pick="crop"><strong>${cropLabel}</strong><span>${day<0?'3 rangées':'24 plants · 4 m²'}</span><small>${planned()?'Intention à confirmer':'Culture enregistrée'}</small></button><div class="vacant">2 m² libres</div>`;
else q('.map-content').innerHTML=`<button class="crop real" data-pick="${selection}"><strong>${selection==='west'?'Sol travaillé':selection==='fallow'?'Jachère volontaire':'Tomates en place'}</strong><span>${selection==='west'?'6 m² disponibles':selection==='fallow'?'4 m² réservés au repos du sol':'8 m² occupés'}</span></button>`;
added.filter(a=>a.parent===(selection==='crop'?'east':selection)).forEach(a=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',a.path);const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=a.name;p.append(title);q('.drawing').append(p);});
q('#map-caption').textContent=selection==='garden'?'Touchez un espace':selection==='east'?'Touchez une culture':'Échelle estimée';
if(draft){renderDraft();return;}
const sheet=q('.sheet');
if(selection==='garden')sheet.innerHTML='<h2>Jardin maison</h2>'+stats([[planned()?'8 m²':'12 m²','cultivés'],['8 m²','disponibles'],['4 m²','en jachère']])+'<div class="meter" aria-label="24 mètres carrés cultivables : 12 utilisés ou réservés, 4 en jachère, 8 disponibles"><i></i><b></b></div><p class="note">Surfaces estimées · allée exclue. '+(planned()?'4 m² réservés aux laitues, exclus du disponible.':'')+'</p>'+button('Voir les tâches','tasks')+(added.length?'<p class="note">'+added.length+' forme ajoutée · surface non dimensionnée, exclue des totaux.</p>':'');
else if(selection==='crop')sheet.innerHTML='<h2>'+ (day<0?'Radis':'Laitues')+'</h2><p class="note">'+(planned()?'Intention · mise en place à confirmer':'En place · travail enregistré')+'</p>'+stats([[day<0?'3':'24',day<0?'rangées':'plants'],['4 m²','surface occupée']])+`<div class="row">${planned()?button('Confirmer la mise en place','confirm',true):button('Voir les tâches','tasks',true)}${button('Modifier','edit-crop')}</div>`;
else if(selection==='east')sheet.innerHTML='<h2>Planche est</h2>'+stats([['2 m²','disponibles'],['4 m²',planned()?'prévus':'cultivés']])+`<div class="row">${button(cropLabel,'crop',true)}${button('Placer une culture','place')}</div><p class="note">${planned()?'6 m² physiquement libres ; 4 m² réservés par l’intention.':'2 m² restent disponibles.'}</p>`;
else sheet.innerHTML=`<h2>${names[selection]}</h2>`+stats([[selection==='west'?'6 m²':selection==='fallow'?'0 m²':'0 m²','disponibles']])+`<p class="note">${selection==='west'?'Sol travaillé enregistré. Aucune culture prévue.':selection==='fallow'?'Jachère volontaire : cet espace reste réservé.':'Tomates en place · vérifier les attaches.'}</p>`+button(selection==='greenhouse'?'Voir les tâches':'Dessiner une zone','space-action');
}
function renderDraft(){q('.sheet').innerHTML=`<h2>Cette forme représente…</h2><p class="note">${selection==='garden'?'Proposition : un nouvel espace dans le jardin.':'Proposition : une zone dans '+names[selection==='crop'?'east':selection]+'.'} Relation modifiable.</p><label>Nature<select id="shape-kind"><option>Espace</option><option>Culture</option><option>Allée</option><option>Obstacle</option><option>Rattacher à un espace existant</option></select></label><label>Nom facultatif<input type="text" id="shape-name" placeholder="Nouvel espace" maxlength="60"></label><label>Contenu dans<select id="shape-parent"><option value="garden">Jardin maison</option><option value="east">Planche est</option><option value="west">Planche ouest</option></select></label><div class="row">${button('Valider','save-shape',true)}${button('Reprendre','resume')}${button('Abandonner','discard')}</div>`;q('#shape-parent').value=['east','west'].includes(selection)?selection:selection==='crop'?'east':'garden';}
function start(){draft=null;drawing=true;points=[];q('.drawing path').setAttribute('d','');q('.drawing').classList.add('active');q('#selection-draw').textContent='Terminer le tracé';q('#assist-label').hidden=false;q('#selection-cancel').hidden=false;q('#map-caption').textContent='Tracez au doigt ou posez les sommets';}
function stop(){drawing=false;q('.drawing').classList.remove('active');q('#selection-draw').textContent='Dessiner';q('#assist-label').hidden=true;q('#selection-cancel').hidden=true;}
function path(){return points.length?'M'+points.map(p=>p.join(',')).join(' L')+' Z':'';}
function finish(){if(points.length<3){feedback('Tracez une forme ou posez au moins trois sommets.');return;}let xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);if(q('#selection-assist').checked){let x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;points=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];}draft=path();q('.drawing path').setAttribute('d',draft);stop();renderDraft();feedback('Forme proposée. Vérifiez sa nature puis validez.');}
const svg=q('.drawing');let pressed=false;
function point(e){let r=svg.getBoundingClientRect();return [Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))];}
svg.addEventListener('pointerdown',e=>{if(!drawing)return;pressed=true;svg.setPointerCapture(e.pointerId);points.push(point(e));});svg.addEventListener('pointermove',e=>{if(!drawing||!pressed)return;let p=point(e),last=points.at(-1);if(Math.hypot(p[0]-last[0],p[1]-last[1])>2)points.push(p);q('.drawing path').setAttribute('d',path());});svg.addEventListener('pointerup',()=>{pressed=false;q('.drawing path').setAttribute('d',path());});svg.addEventListener('pointercancel',()=>pressed=false);
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.pick){if(drawing||draft)return;selection=b.dataset.pick;render();}
if(b.dataset.period!==undefined||b.dataset.step){if(drawing||draft){feedback('Validez ou abandonnez la forme avant de changer la date.');return;}day=b.dataset.period!==undefined?Number(b.dataset.period):Math.max(-60,Math.min(90,day+Number(b.dataset.step)));render();}
if(b.id==='selection-draw')drawing?finish():start();if(b.id==='selection-cancel'){stop();draft=null;points=[];q('.drawing path').setAttribute('d','');render();}
const a=b.dataset.action;if(a==='crop'){selection='crop';render();}if(a==='place'||a==='space-action'&&selection!=='greenhouse')start();
if(a==='confirm'){previous=confirmed;confirmed=true;render();feedback('Mise en place enregistrée. L’intention est conservée.',true);}if(a==='undo'){confirmed=previous??false;render();feedback('Mise en place annulée.');}
if(a==='tasks'||a==='space-action'&&selection==='greenhouse'){q('.sheet').innerHTML='<h2>Travail à effectuer</h2><p class="task">Planche est · préparer le sol</p><p class="task">Planche est · mettre en place les laitues</p><p class="task">Serre · vérifier les attaches</p>'+button('Revenir à la sélection','back');}
if(a==='back')render();if(a==='edit-crop'){q('.sheet').innerHTML='<h2>Modifier la culture</h2><label>Nom<input id="crop-name" type="text" value="Laitues"></label><p class="note">Modification illustrative, sans enregistrement métier.</p>'+button('Revenir','back');}
if(a==='save-shape'){added.push({path:draft,name:q('#shape-name').value||q('#shape-kind').value,parent:q('#shape-parent').value});draft=null;q('.drawing path').setAttribute('d','');render();feedback('Forme ajoutée · dimensions encore inconnues.');}
if(a==='resume')start();if(a==='discard'){draft=null;q('.drawing path').setAttribute('d','');render();}
});
q('input[type=range]').addEventListener('input',e=>{if(drawing||draft){e.target.value=day;return;}day=Number(e.target.value);render();});
render();if(globalThis.Tweak){const preferences={height:330};new Tweak({container:root,onChange:()=>q('.canvas').style.height=preferences.height+'px'}).addSlider(preferences,'height',{label:'Hauteur du plan',min:270,max:440,step:10,unit:'px'});}
})();
</script>
</div>
