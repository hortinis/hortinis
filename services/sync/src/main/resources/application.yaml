spring:
  application:
    name: hortinis-sync
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      flush-mode: immediate
      save-mode: on-set-attribute
      cleanup-cron: "0 * * * * *"
    servlet:
      filter-order: -2147483618
  main:
    log-startup-info: false
  jackson:
    factory:
      constraints:
        read:
          max-document-length: 65536
          max-nesting-depth: 8
          max-token-count: 64

logging:
  level:
    org.springframework.security: OFF
    org.springframework.session: OFF
    "[org.springframework.scheduling.support.TaskUtils$LoggingErrorHandler]": OFF
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
