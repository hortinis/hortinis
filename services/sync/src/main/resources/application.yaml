server:
  servlet:
    session:
      tracking-modes: cookie

spring:
  application:
    name: hortinis-sync
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      flush-mode: immediate
      save-mode: on-set-attribute
      cleanup-cron: "0 * * * * *"
    servlet:
      filter-order: -2147483618
  mail:
    test-connection: false
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
      "[mail.debug]": false
      "[mail.debug.auth]": false
  main:
    log-startup-info: false
  jackson:
    factory:
      constraints:
        read:
          max-document-length: 65536
          max-nesting-depth: 8
          max-token-count: 64

logging:
  level:
    org.springframework.security: OFF
    org.springframework.session: OFF
    org.springframework.mail: OFF
    org.eclipse.angus.mail: OFF
    "[org.springframework.scheduling.support.TaskUtils$LoggingErrorHandler]": OFF
  structured:
    format:
      console: logstash

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
