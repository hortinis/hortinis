spring:
  application:
    name: hortinis-sync
  main:
    log-startup-info: false
  jackson:
    factory:
      constraints:
        read:
          max-document-length: 65536
          max-nesting-depth: 8
          max-token-count: 64

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
