components:
  schemas:
    Models.AccessDeniedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - ACCESS_DENIED
        message:
          type: string
          enum:
            - Access is denied.
      unevaluatedProperties:
        not: {}
    Models.AccessUnavailableError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - ACCESS_UNAVAILABLE
        message:
          type: string
          enum:
            - The access service is unavailable.
      unevaluatedProperties:
        not: {}
    Models.AccountId:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      format: uuid
      description: A server-owned account identity, distinct from its scope.
    Models.AccountSetupRequest:
      type: object
      required:
        - ticket
        - login
        - password
      properties:
        ticket:
          $ref: '#/components/schemas/Models.EncodedRandomValue'
        login:
          $ref: '#/components/schemas/Models.LoginIdentifier'
        password:
          $ref: '#/components/schemas/Models.NewPassword'
      unevaluatedProperties:
        not: {}
    Models.AnonymousAuthenticationStatus:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - anonymous
      unevaluatedProperties:
        not: {}
    Models.AuthenticatePasskeyRequest:
      type: object
      required:
        - id
        - rawId
        - type
        - response
      properties:
        id:
          $ref: '#/components/schemas/Models.WebAuthnCredentialId'
        rawId:
          $ref: '#/components/schemas/Models.WebAuthnCredentialId'
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          properties:
            clientDataJSON:
              $ref: '#/components/schemas/Models.WebAuthnClientData'
            authenticatorData:
              $ref: '#/components/schemas/Models.WebAuthnProofPart'
            signature:
              $ref: '#/components/schemas/Models.WebAuthnProofPart'
            userHandle:
              $ref: '#/components/schemas/Models.EncodedRandomValue'
          required:
            - clientDataJSON
            - authenticatorData
            - signature
            - userHandle
          unevaluatedProperties:
            not: {}
      unevaluatedProperties:
        not: {}
    Models.AuthenticatedScopeIdentity:
      type: object
      required:
        - authority
        - accessMode
        - synchronizationScopeId
        - accountId
      properties:
        authority:
          type: string
          enum:
            - authenticated
        accessMode:
          type: string
          enum:
            - single-user-auth
            - multi-user-auth
        synchronizationScopeId:
          $ref: '#/components/schemas/Models.SynchronizationScopeId'
        accountId:
          $ref: '#/components/schemas/Models.AccountId'
      unevaluatedProperties:
        not: {}
    Models.AuthenticationCompleted:
      type: object
      required:
        - completed
      properties:
        completed:
          type: boolean
          enum:
            - true
      unevaluatedProperties:
        not: {}
    Models.AuthenticationFailedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_FAILED
        message:
          type: string
          enum:
            - Authentication failed.
      unevaluatedProperties:
        not: {}
    Models.AuthenticationPreconditionFailedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_PRECONDITION_FAILED
        message:
          type: string
          enum:
            - The authentication precondition no longer holds.
      unevaluatedProperties:
        not: {}
    Models.AuthenticationRequiredError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_REQUIRED
        message:
          type: string
          enum:
            - Authentication is required.
      unevaluatedProperties:
        not: {}
    Models.AuthenticationStatus:
      anyOf:
        - $ref: '#/components/schemas/Models.AnonymousAuthenticationStatus'
        - $ref: '#/components/schemas/Models.LimitedAuthenticationStatus'
        - $ref: '#/components/schemas/Models.FullAuthenticationStatus'
    Models.AuthenticationThrottledError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_THROTTLED
        message:
          type: string
          enum:
            - Authentication attempts are temporarily limited.
      unevaluatedProperties:
        not: {}
    Models.AuthorizedScopeIdentity:
      anyOf:
        - $ref: '#/components/schemas/Models.ConfiguredScopeIdentity'
        - $ref: '#/components/schemas/Models.AuthenticatedScopeIdentity'
    Models.AvailableRecoveryCodeStatus:
      type: object
      required:
        - remaining
        - expiresAt
        - expiresSoon
      properties:
        remaining:
          type: integer
          minimum: 1
          maximum: 10
        expiresAt:
          type: string
          format: date-time
        expiresSoon:
          type: boolean
      unevaluatedProperties:
        not: {}
    Models.BindingPreconditionFailedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - BINDING_PRECONDITION_FAILED
        message:
          type: string
          enum:
            - The binding precondition no longer holds.
      unevaluatedProperties:
        not: {}
    Models.ChangePage:
      type: object
      required:
        - changes
        - nextCursor
        - hasMore
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Models.TechnicalChange'
        nextCursor:
          $ref: '#/components/schemas/Models.SyncCursor'
        hasMore:
          type: boolean
      unevaluatedProperties:
        not: {}
      description: A page of accepted changes and the opaque cursor following the complete page.
    Models.ConfiguredScopeIdentity:
      type: object
      required:
        - authority
        - accessMode
        - synchronizationScopeId
      properties:
        authority:
          type: string
          enum:
            - configured
        accessMode:
          type: string
          enum:
            - single-user-no-auth
        synchronizationScopeId:
          $ref: '#/components/schemas/Models.SynchronizationScopeId'
      unevaluatedProperties:
        not: {}
    Models.ConfirmEmptyBindingRequest:
      type: object
      required:
        - expectation
        - expectedPopulation
      properties:
        expectation:
          $ref: '#/components/schemas/Models.ExchangeExpectation'
        expectedPopulation:
          type: string
          enum:
            - empty
      unevaluatedProperties:
        not: {}
    Models.ConflictError:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Models.OperationIdReusedError'
        - $ref: '#/components/schemas/Models.RecordAlreadyExistsError'
        - $ref: '#/components/schemas/Models.RecordIdentifierRetiredError'
        - $ref: '#/components/schemas/Models.RevisionConflictError'
      discriminator:
        propertyName: code
        mapping:
          OPERATION_ID_REUSED: '#/components/schemas/Models.OperationIdReusedError'
          RECORD_ALREADY_EXISTS: '#/components/schemas/Models.RecordAlreadyExistsError'
          RECORD_IDENTIFIER_RETIRED: '#/components/schemas/Models.RecordIdentifierRetiredError'
          REVISION_CONFLICT: '#/components/schemas/Models.RevisionConflictError'
    Models.CreateTechnicalRecordOperation:
      type: object
      required:
        - operationId
        - recordId
        - value
        - kind
      properties:
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
          description: The stable operation and idempotency identifier.
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        value:
          $ref: '#/components/schemas/Models.TechnicalRecordValue'
        kind:
          type: string
          enum:
            - create
      unevaluatedProperties:
        not: {}
      description: Create a technical record that does not yet exist.
    Models.CredentialList:
      type: object
      required:
        - credentials
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/Models.CredentialSummary'
          maxItems: 8
      unevaluatedProperties:
        not: {}
    Models.CredentialSummary:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/Models.WebAuthnCredentialId'
        label:
          type: string
          maxLength: 64
          pattern: ^[^\u0000]*$
          description: Optional user label; Unicode scalar text excluding NUL.
      unevaluatedProperties:
        not: {}
    Models.CredentialTargetRequest:
      type: object
      required:
        - credentialId
      properties:
        credentialId:
          $ref: '#/components/schemas/Models.WebAuthnCredentialId'
      unevaluatedProperties:
        not: {}
    Models.CsrfBootstrap:
      type: object
      required:
        - token
        - headerName
      properties:
        token:
          $ref: '#/components/schemas/Models.CsrfValue'
        headerName:
          type: string
          enum:
            - X-CSRF-TOKEN
      unevaluatedProperties:
        not: {}
    Models.CsrfValue:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,256}$
      description: Transient session-backed CSRF value; never persist in browser data or carry in URLs.
    Models.CurrentPasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          $ref: '#/components/schemas/Models.LoginPassword'
      unevaluatedProperties:
        not: {}
    Models.DeleteTechnicalRecordOperation:
      type: object
      required:
        - operationId
        - recordId
        - kind
        - expectedRevision
      properties:
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
          description: The stable operation and idempotency identifier.
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        kind:
          type: string
          enum:
            - delete
        expectedRevision:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: Delete an existing technical record at its expected server revision.
    Models.EncodedRandomValue:
      type: string
      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
      description: Canonical unpadded base64url encoding of 32 bytes; semantics depend on the containing field.
    Models.ExchangeExpectation:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,256}$
      description: A non-secret expectation checked after independent authorization; never carried in URLs.
    Models.ForgottenPasswordRequest:
      type: object
      required:
        - login
        - recoveryCode
      properties:
        login:
          $ref: '#/components/schemas/Models.LoginIdentifier'
        recoveryCode:
          $ref: '#/components/schemas/Models.EncodedRandomValue'
      unevaluatedProperties:
        not: {}
    Models.FullAuthenticationStatus:
      type: object
      required:
        - state
        - accountId
        - logoutTarget
        - absoluteExpiresAt
      properties:
        state:
          type: string
          enum:
            - authenticated
        accountId:
          $ref: '#/components/schemas/Models.AccountId'
        logoutTarget:
          $ref: '#/components/schemas/Models.EncodedRandomValue'
          description: Non-secret logout target, distinct from the session cookie; never authorization.
        absoluteExpiresAt:
          type: string
          format: date-time
      unevaluatedProperties:
        not: {}
    Models.GenerationSynchronizationBoundary:
      type: object
      required:
        - kind
        - generation
      properties:
        kind:
          type: string
          enum:
            - generation
        generation:
          $ref: '#/components/schemas/Models.SyncGeneration'
      unevaluatedProperties:
        not: {}
    Models.GenerationlessSynchronizationBoundary:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - generationless
      unevaluatedProperties:
        not: {}
      description: Synchronization without a server generation identifier.
    Models.InvalidRequestError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
        message:
          type: string
          minLength: 1
      unevaluatedProperties:
        not: {}
      description: The request does not satisfy the synchronization contract.
    Models.LimitedAuthenticationStatus:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - password
