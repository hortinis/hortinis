openapi: 3.1.0
info:
  title: Hortinis Synchronization API
  version: 1.0.0
  description: The contract-first HTTP API for the Hortinis synchronization service.
tags: []
paths:
  /api/v1/auth/activity:
    post:
      operationId: recordAuthenticatedInteraction
      summary: Acknowledge authenticated account activity
      description: Require a full session. Spring Session updates inactivity for ordinary requests, including synchronization and polling. This compatibility acknowledgement does not renew the normal-factor lifetime.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AuthenticationCompleted'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InvalidRequestError'
        '401':
          description: Access is unauthorized.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Models.AuthenticationFailedError'
                  - $ref: '#/components/schemas/Models.AuthenticationRequiredError'
        '403':
          description: Access is forbidden.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AccessDeniedError'
        '409':
          description: The request conflicts with the current state of the server.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AuthenticationPreconditionFailedError'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: string
                enum:
                  - '60'
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AuthenticationThrottledError'
        '503':
