        not: {}
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: __Host-hortinis-session
      description: Host-only Secure, HttpOnly, SameSite=Strict session cookie. A limited cookie grants no garden authority; current account/session state is checked independently.
    CsrfHeaderAuth:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Session-backed CSRF proof for every unsafe authenticated-mode request, including pre-authentication ceremonies. Not a login credential.
