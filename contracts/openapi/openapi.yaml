openapi: 3.1.0
info:
  title: Hortinis Synchronization API
  version: 1.0.0
  description: The contract-first HTTP API for the Hortinis synchronization service.
tags: []
paths:
  /api/v1/sync/changes:
    get:
      operationId: pullTechnicalRecordChanges
      summary: Pull accepted technical-record changes
      description: Read accepted changes after an optional opaque cursor.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Models.SyncCursor'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.ChangePage'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InvalidRequestError'
  /api/v1/sync/operations:
    post:
      operationId: submitTechnicalRecordOperation
      summary: Submit one technical-record operation
      description: Accept or identically replay one technical-record operation.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.OperationResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InvalidRequestError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.RecordNotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.ConflictError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.TechnicalRecordOperation'
  /api/v1/sync/reconciliations:
    post:
      operationId: startTechnicalRecordReconciliation
      summary: Start one anchored full-reconciliation session
      description: Capture an internally consistent technical-record snapshot at one server sequence.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.ReconciliationSession'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InvalidRequestError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.StartReconciliationRequest'
  /api/v1/sync/reconciliations/{reconciliationId}/snapshot:
    get:
      operationId: pullTechnicalRecordSnapshot
      summary: Pull one page from an anchored reconciliation snapshot
      description: Continue an immutable snapshot session with its opaque, session-bound cursor.
      parameters:
        - name: reconciliationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Models.ReconciliationId'
        - name: cursor
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Models.SnapshotCursor'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.SnapshotPage'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InvalidRequestError'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.SnapshotExpiredError'
components:
  schemas:
    Models.ChangePage:
      type: object
      required:
        - changes
        - nextCursor
        - hasMore
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Models.TechnicalChange'
        nextCursor:
          $ref: '#/components/schemas/Models.SyncCursor'
        hasMore:
          type: boolean
      unevaluatedProperties:
        not: {}
      description: A page of accepted changes and the opaque cursor following the complete page.
    Models.ConflictError:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Models.OperationIdReusedError'
        - $ref: '#/components/schemas/Models.RecordAlreadyExistsError'
        - $ref: '#/components/schemas/Models.RevisionConflictError'
      discriminator:
        propertyName: code
        mapping:
          OPERATION_ID_REUSED: '#/components/schemas/Models.OperationIdReusedError'
          RECORD_ALREADY_EXISTS: '#/components/schemas/Models.RecordAlreadyExistsError'
          REVISION_CONFLICT: '#/components/schemas/Models.RevisionConflictError'
    Models.CreateTechnicalRecordOperation:
      type: object
      required:
        - operationId
        - recordId
        - value
        - kind
      properties:
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
          description: The stable operation and idempotency identifier.
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        value:
          type: string
        kind:
          type: string
          enum:
            - create
      unevaluatedProperties:
        not: {}
      description: Create a technical record that does not yet exist.
    Models.InvalidRequestError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
        message:
          type: string
          minLength: 1
      unevaluatedProperties:
        not: {}
      description: The request does not satisfy the synchronization contract.
    Models.LiveSnapshotEntry:
      type: object
      required:
        - kind
        - record
      properties:
        kind:
          type: string
          enum:
            - record
        record:
          $ref: '#/components/schemas/Models.TechnicalRecord'
      unevaluatedProperties:
        not: {}
      description: A live record in an anchored snapshot.
    Models.OperationIdReusedError:
      type: object
      required:
        - code
        - message
        - operationId
      properties:
        code:
          type: string
          enum:
            - OPERATION_ID_REUSED
        message:
          type: string
          minLength: 1
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
      unevaluatedProperties:
        not: {}
      description: The operation identifier was already used with a different canonical request.
    Models.OperationResult:
      type: object
      required:
        - outcome
        - operationId
        - record
        - sequence
      properties:
        outcome:
          type: string
          enum:
            - accepted
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        record:
          $ref: '#/components/schemas/Models.TechnicalRecord'
        sequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: The stable result returned when an operation is accepted or replayed identically.
    Models.PositiveDecimal:
      type: string
      pattern: ^[1-9][0-9]*$
      description: A positive integer encoded as a decimal string for cross-runtime precision.
    Models.ReconciliationId:
      type: string
      minLength: 1
      description: An opaque, non-empty reconciliation-session identifier controlled by the server.
    Models.ReconciliationSession:
      type: object
      required:
        - reconciliationId
        - generation
        - anchorSequence
        - firstSnapshotCursor
        - expiresAt
      properties:
        reconciliationId:
          $ref: '#/components/schemas/Models.ReconciliationId'
        generation:
          $ref: '#/components/schemas/Models.SyncGeneration'
        anchorSequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        firstSnapshotCursor:
          $ref: '#/components/schemas/Models.SnapshotCursor'
        expiresAt:
          type: string
          format: date-time
      unevaluatedProperties:
        not: {}
      description: An anchored reconciliation session and its first opaque snapshot cursor.
    Models.RecordAlreadyExistsError:
      type: object
      required:
        - code
        - message
        - operationId
        - currentRecord
      properties:
        code:
          type: string
          enum:
            - RECORD_ALREADY_EXISTS
        message:
          type: string
          minLength: 1
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        currentRecord:
          $ref: '#/components/schemas/Models.TechnicalRecord'
      unevaluatedProperties:
        not: {}
      description: Creation failed because the technical record already exists.
    Models.RecordNotFoundError:
      type: object
      required:
        - code
        - message
        - operationId
        - recordId
      properties:
        code:
          type: string
          enum:
            - RECORD_NOT_FOUND
        message:
          type: string
          minLength: 1
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
      unevaluatedProperties:
        not: {}
      description: The operation targets a technical record that does not exist.
    Models.ReplaceTechnicalRecordOperation:
      type: object
      required:
        - operationId
        - recordId
        - value
        - kind
        - expectedRevision
      properties:
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
          description: The stable operation and idempotency identifier.
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        value:
          type: string
        kind:
          type: string
          enum:
            - replace
        expectedRevision:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: Replace a technical record at its expected server revision.
    Models.RevisionConflictError:
      type: object
      required:
        - code
        - message
        - operationId
        - expectedRevision
        - currentRecord
      properties:
        code:
          type: string
          enum:
            - REVISION_CONFLICT
        message:
          type: string
          minLength: 1
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        expectedRevision:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        currentRecord:
          $ref: '#/components/schemas/Models.TechnicalRecord'
      unevaluatedProperties:
        not: {}
      description: Replacement failed because the expected and current revisions differ.
    Models.SnapshotContinuationPage:
      type: object
      required:
        - reconciliationId
        - generation
        - anchorSequence
        - entries
        - hasMore
        - nextCursor
      properties:
        reconciliationId:
          $ref: '#/components/schemas/Models.ReconciliationId'
        generation:
          $ref: '#/components/schemas/Models.SyncGeneration'
        anchorSequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Models.SnapshotEntry'
        hasMore:
          type: boolean
          enum:
            - true
        nextCursor:
          $ref: '#/components/schemas/Models.SnapshotCursor'
      unevaluatedProperties:
        not: {}
      description: A non-final page from one immutable anchored snapshot.
    Models.SnapshotCursor:
      type: string
      minLength: 1
      description: An opaque, non-empty cursor bound to one anchored snapshot session.
    Models.SnapshotEntry:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Models.LiveSnapshotEntry'
        - $ref: '#/components/schemas/Models.TombstoneSnapshotEntry'
      discriminator:
        propertyName: kind
        mapping:
          record: '#/components/schemas/Models.LiveSnapshotEntry'
          tombstone: '#/components/schemas/Models.TombstoneSnapshotEntry'
      description: One entry in a complete anchored server snapshot.
    Models.SnapshotExpiredError:
      type: object
      required:
        - code
        - message
        - reconciliationId
      properties:
        code:
          type: string
          enum:
            - SNAPSHOT_EXPIRED
        message:
          type: string
          minLength: 1
        reconciliationId:
          $ref: '#/components/schemas/Models.ReconciliationId'
      unevaluatedProperties:
        not: {}
      description: The anchored snapshot session or cursor has expired.
    Models.SnapshotFinalPage:
      type: object
      required:
        - reconciliationId
        - generation
        - anchorSequence
        - entries
        - hasMore
        - incrementalCursor
      properties:
        reconciliationId:
          $ref: '#/components/schemas/Models.ReconciliationId'
        generation:
          $ref: '#/components/schemas/Models.SyncGeneration'
        anchorSequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Models.SnapshotEntry'
        hasMore:
          type: boolean
          enum:
            - false
        incrementalCursor:
          $ref: '#/components/schemas/Models.SyncCursor'
      unevaluatedProperties:
        not: {}
      description: The final snapshot page and the opaque incremental cursor positioned after its anchor.
    Models.SnapshotPage:
      anyOf:
        - $ref: '#/components/schemas/Models.SnapshotContinuationPage'
        - $ref: '#/components/schemas/Models.SnapshotFinalPage'
      description: One page from an internally consistent anchored snapshot.
    Models.StartReconciliationFromState:
      type: object
      required:
        - previousGeneration
        - previousCursor
      properties:
        previousGeneration:
          $ref: '#/components/schemas/Models.SyncGeneration'
        previousCursor:
          $ref: '#/components/schemas/Models.SyncCursor'
      unevaluatedProperties:
        not: {}
      description: Start a full reconciliation from one matching generation and cursor pair.
    Models.StartReconciliationRequest:
      anyOf:
        - $ref: '#/components/schemas/Models.StartReconciliationWithoutState'
        - $ref: '#/components/schemas/Models.StartReconciliationFromState'
      description: Start a full reconciliation either without state or from one complete persisted boundary.
    Models.StartReconciliationWithoutState:
      type: object
      unevaluatedProperties:
        not: {}
      description: Start a full reconciliation without previously persisted synchronization state.
    Models.SyncCursor:
      type: string
      minLength: 1
      description: An opaque, non-empty incremental synchronization cursor.
    Models.SyncGeneration:
      type: string
      minLength: 1
      description: An opaque, non-empty synchronization-generation identifier controlled by the server.
    Models.TechnicalChange:
      type: object
      required:
        - operationId
        - record
        - sequence
      properties:
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        record:
          $ref: '#/components/schemas/Models.TechnicalRecord'
        sequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: One accepted server change in monotonic server-sequence order.
    Models.TechnicalRecord:
      type: object
      required:
        - recordId
        - revision
        - value
      properties:
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        revision:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        value:
          type: string
      unevaluatedProperties:
        not: {}
      description: The deliberately technical record used to validate the synchronization mechanism.
    Models.TechnicalRecordOperation:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Models.CreateTechnicalRecordOperation'
        - $ref: '#/components/schemas/Models.ReplaceTechnicalRecordOperation'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/Models.CreateTechnicalRecordOperation'
          replace: '#/components/schemas/Models.ReplaceTechnicalRecordOperation'
      description: One stable technical-record operation submitted for synchronization.
    Models.TechnicalTombstone:
      type: object
      required:
        - recordId
        - revision
        - deletedAtSequence
      properties:
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        revision:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        deletedAtSequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: The retained synchronization representation of an accepted deletion.
    Models.TombstoneSnapshotEntry:
      type: object
      required:
        - kind
        - tombstone
      properties:
        kind:
          type: string
          enum:
            - tombstone
        tombstone:
          $ref: '#/components/schemas/Models.TechnicalTombstone'
      unevaluatedProperties:
        not: {}
      description: A retained deletion in an anchored snapshot.
    Models.Uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      format: uuid
      description: A canonical lowercase UUID identifier.
