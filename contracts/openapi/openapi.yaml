openapi: 3.1.0
info:
  title: Hortinis Synchronization API
  version: 1.0.0
  description: The contract-first HTTP API for the Hortinis synchronization service.
tags: []
paths:
  /api/v1/server/capabilities:
    get:
      operationId: readServerCapabilities
      summary: Read public server compatibility information
      description: Contract-only until S6. Never return account/scope identity, content, or setup secrets.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.ServerCapabilities'
        '503':
          description: Service unavailable.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AccessUnavailableError'
  /api/v1/sync/bindings/confirm:
    post:
      operationId: confirmEmptySynchronizationBinding
      summary: Confirm an observed empty synchronization destination
      description: Contract-only until S6. Revalidate current access, expectation, and empty population atomically. Never provision a scope from this request.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.SynchronizationBootstrap'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InvalidRequestError'
        '401':
          description: Access is unauthorized.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AuthenticationRequiredError'
        '403':
          description: Access is forbidden.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AccessDeniedError'
        '409':
          description: The request conflicts with the current state of the server.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.BindingPreconditionFailedError'
        '503':
          description: Service unavailable.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AccessUnavailableError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.ConfirmEmptyBindingRequest'
  /api/v1/sync/bootstrap:
    get:
      operationId: readSynchronizationBootstrap
      summary: Observe the currently authorized synchronization destination
      description: Contract-only until S6. Resolve current access before reading population or identity. This observation does not authorize later exchange or advance a cursor.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.SynchronizationBootstrap'
        '401':
          description: Access is unauthorized.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AuthenticationRequiredError'
        '403':
          description: Access is forbidden.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AccessDeniedError'
        '503':
          description: Service unavailable.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AccessUnavailableError'
  /api/v1/sync/changes:
    get:
      operationId: pullTechnicalRecordChanges
      summary: Pull accepted technical-record changes
      description: Read accepted changes after an optional opaque cursor.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Models.SyncCursor'
          explode: false
        - name: Sync-Expectation
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/Models.ExchangeExpectation'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.ChangePage'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InvalidRequestError'
        '401':
          description: Access is unauthorized.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AuthenticationRequiredError'
        '403':
          description: Access is forbidden.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AccessDeniedError'
        '409':
          description: The request conflicts with the current state of the server.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.BindingPreconditionFailedError'
        '503':
          description: Service unavailable.
          headers:
            Retry-After:
              required: false
              description: Always sent for synchronization persistence failures; optional in the shared 503 response because access failures have no retry guidance.
              schema:
                type: string
                enum:
                  - '1'
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Models.SynchronizationUnavailableError'
                  - $ref: '#/components/schemas/Models.AccessUnavailableError'
  /api/v1/sync/operations:
    post:
      operationId: submitTechnicalRecordOperation
      summary: Submit one technical-record operation
      description: Accept or identically replay one create, replacement, or deletion operation. Generation binding becomes mandatory in G3.
      parameters:
        - name: Sync-Expectation
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/Models.ExchangeExpectation'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.OperationResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InvalidRequestError'
        '401':
          description: Access is unauthorized.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AuthenticationRequiredError'
        '403':
          description: Access is forbidden.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AccessDeniedError'
        '404':
          description: The server cannot find the requested resource.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.RecordNotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Models.ConflictError'
                  - $ref: '#/components/schemas/Models.BindingPreconditionFailedError'
        '503':
          description: Service unavailable.
          headers:
            Retry-After:
              required: false
              description: Always sent for synchronization persistence failures; optional in the shared 503 response because access failures have no retry guidance.
              schema:
                type: string
                enum:
                  - '1'
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Models.SynchronizationUnavailableError'
                  - $ref: '#/components/schemas/Models.AccessUnavailableError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.TechnicalRecordOperation'
  /api/v1/sync/reconciliations:
    post:
      operationId: startTechnicalRecordReconciliation
      summary: Start one anchored full-reconciliation session
      description: Capture an internally consistent technical-record snapshot at one server sequence.
      parameters:
        - name: Sync-Expectation
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/Models.ExchangeExpectation'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.ReconciliationSession'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InvalidRequestError'
        '401':
          description: Access is unauthorized.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AuthenticationRequiredError'
        '403':
          description: Access is forbidden.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AccessDeniedError'
        '409':
          description: The request conflicts with the current state of the server.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.BindingPreconditionFailedError'
        '503':
          description: Service unavailable.
          headers:
            Retry-After:
              required: false
              description: Always sent for synchronization persistence failures; optional in the shared 503 response because access failures have no retry guidance.
              schema:
                type: string
                enum:
                  - '1'
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Models.SynchronizationUnavailableError'
                  - $ref: '#/components/schemas/Models.AccessUnavailableError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.StartReconciliationRequest'
  /api/v1/sync/reconciliations/{reconciliationId}/snapshot:
    get:
      operationId: pullTechnicalRecordSnapshot
      summary: Pull one page from an anchored reconciliation snapshot
      description: Continue an immutable snapshot session with its opaque, session-bound cursor.
      parameters:
        - name: reconciliationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Models.ReconciliationId'
        - name: cursor
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Models.SnapshotCursor'
          explode: false
        - name: Sync-Expectation
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/Models.ExchangeExpectation'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.SnapshotPage'
        '400':
          description: The server could not understand the request due to invalid syntax.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InvalidRequestError'
        '401':
          description: Access is unauthorized.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AuthenticationRequiredError'
        '403':
          description: Access is forbidden.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.AccessDeniedError'
        '409':
          description: The request conflicts with the current state of the server.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.BindingPreconditionFailedError'
        '410':
          description: Client error
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.SnapshotExpiredError'
        '503':
          description: Service unavailable.
          headers:
            Retry-After:
              required: false
              description: Always sent for synchronization persistence failures; optional in the shared 503 response because access failures have no retry guidance.
              schema:
                type: string
                enum:
                  - '1'
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Models.SynchronizationUnavailableError'
                  - $ref: '#/components/schemas/Models.AccessUnavailableError'
components:
  schemas:
    Models.AccessDeniedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - ACCESS_DENIED
        message:
          type: string
          enum:
            - Access is denied.
      unevaluatedProperties:
        not: {}
    Models.AccessUnavailableError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - ACCESS_UNAVAILABLE
        message:
          type: string
          enum:
            - The access service is unavailable.
      unevaluatedProperties:
        not: {}
    Models.AccountId:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      format: uuid
      description: A server-owned account identity, distinct from its scope.
    Models.AuthenticatedScopeIdentity:
      type: object
      required:
        - authority
        - accessMode
        - synchronizationScopeId
        - accountId
      properties:
        authority:
          type: string
          enum:
            - authenticated
        accessMode:
          type: string
          enum:
            - single-user-auth
            - multi-user-auth
        synchronizationScopeId:
          $ref: '#/components/schemas/Models.SynchronizationScopeId'
        accountId:
          $ref: '#/components/schemas/Models.AccountId'
      unevaluatedProperties:
        not: {}
    Models.AuthenticationRequiredError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_REQUIRED
        message:
          type: string
          enum:
            - Authentication is required.
      unevaluatedProperties:
        not: {}
    Models.AuthorizedScopeIdentity:
      anyOf:
        - $ref: '#/components/schemas/Models.ConfiguredScopeIdentity'
        - $ref: '#/components/schemas/Models.AuthenticatedScopeIdentity'
    Models.BindingPreconditionFailedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - BINDING_PRECONDITION_FAILED
        message:
          type: string
          enum:
            - The binding precondition no longer holds.
      unevaluatedProperties:
        not: {}
    Models.ChangePage:
      type: object
      required:
        - changes
        - nextCursor
        - hasMore
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Models.TechnicalChange'
        nextCursor:
          $ref: '#/components/schemas/Models.SyncCursor'
        hasMore:
          type: boolean
      unevaluatedProperties:
        not: {}
      description: A page of accepted changes and the opaque cursor following the complete page.
    Models.ConfiguredScopeIdentity:
      type: object
      required:
        - authority
        - accessMode
        - synchronizationScopeId
      properties:
        authority:
          type: string
          enum:
            - configured
        accessMode:
          type: string
          enum:
            - single-user-no-auth
        synchronizationScopeId:
          $ref: '#/components/schemas/Models.SynchronizationScopeId'
      unevaluatedProperties:
        not: {}
    Models.ConfirmEmptyBindingRequest:
      type: object
      required:
        - expectation
        - expectedPopulation
      properties:
        expectation:
          $ref: '#/components/schemas/Models.ExchangeExpectation'
        expectedPopulation:
          type: string
          enum:
            - empty
      unevaluatedProperties:
        not: {}
    Models.ConflictError:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Models.OperationIdReusedError'
        - $ref: '#/components/schemas/Models.RecordAlreadyExistsError'
        - $ref: '#/components/schemas/Models.RecordIdentifierRetiredError'
        - $ref: '#/components/schemas/Models.RevisionConflictError'
      discriminator:
        propertyName: code
        mapping:
          OPERATION_ID_REUSED: '#/components/schemas/Models.OperationIdReusedError'
          RECORD_ALREADY_EXISTS: '#/components/schemas/Models.RecordAlreadyExistsError'
          RECORD_IDENTIFIER_RETIRED: '#/components/schemas/Models.RecordIdentifierRetiredError'
          REVISION_CONFLICT: '#/components/schemas/Models.RevisionConflictError'
    Models.CreateTechnicalRecordOperation:
      type: object
      required:
        - operationId
        - recordId
        - value
        - kind
      properties:
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
          description: The stable operation and idempotency identifier.
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        value:
          type: string
        kind:
          type: string
          enum:
            - create
      unevaluatedProperties:
        not: {}
      description: Create a technical record that does not yet exist.
    Models.DeleteTechnicalRecordOperation:
      type: object
      required:
        - operationId
        - recordId
        - kind
        - expectedRevision
      properties:
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
          description: The stable operation and idempotency identifier.
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        kind:
          type: string
          enum:
            - delete
        expectedRevision:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: Delete an existing technical record at its expected server revision.
    Models.ExchangeExpectation:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,256}$
      description: A non-secret expectation checked after independent authorization; never carried in URLs.
    Models.G2SynchronizationBoundary:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - g2
      unevaluatedProperties:
        not: {}
    Models.GenerationSynchronizationBoundary:
      type: object
      required:
        - kind
        - generation
      properties:
        kind:
          type: string
          enum:
            - generation
        generation:
          $ref: '#/components/schemas/Models.SyncGeneration'
      unevaluatedProperties:
        not: {}
    Models.InvalidRequestError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
        message:
          type: string
          minLength: 1
      unevaluatedProperties:
        not: {}
      description: The request does not satisfy the synchronization contract.
    Models.LiveSnapshotEntry:
      type: object
      required:
        - kind
        - record
      properties:
        kind:
          type: string
          enum:
            - record
        record:
          $ref: '#/components/schemas/Models.TechnicalRecord'
      unevaluatedProperties:
        not: {}
      description: A live record in an anchored snapshot.
    Models.OperationIdReusedError:
      type: object
      required:
        - code
        - message
        - operationId
      properties:
        code:
          type: string
          enum:
            - OPERATION_ID_REUSED
        message:
          type: string
          minLength: 1
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
      unevaluatedProperties:
        not: {}
      description: The operation identifier was already used with a different canonical request.
    Models.OperationResult:
      anyOf:
        - $ref: '#/components/schemas/Models.RecordOperationResult'
        - $ref: '#/components/schemas/Models.TombstoneOperationResult'
      description: The stable result returned when an operation is accepted or replayed identically.
    Models.PositiveDecimal:
      type: string
      pattern: ^[1-9][0-9]*$
      description: A positive integer encoded as a decimal string for cross-runtime precision.
    Models.ReconciliationId:
      type: string
      minLength: 1
      description: An opaque, non-empty reconciliation-session identifier controlled by the server.
    Models.ReconciliationSession:
      type: object
      required:
        - reconciliationId
        - generation
        - anchorSequence
        - firstSnapshotCursor
        - expiresAt
      properties:
        reconciliationId:
          $ref: '#/components/schemas/Models.ReconciliationId'
        generation:
          $ref: '#/components/schemas/Models.SyncGeneration'
        anchorSequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        firstSnapshotCursor:
          $ref: '#/components/schemas/Models.SnapshotCursor'
        expiresAt:
          type: string
          format: date-time
      unevaluatedProperties:
        not: {}
      description: An anchored reconciliation session and its first opaque snapshot cursor.
    Models.RecordAlreadyExistsError:
      type: object
      required:
        - code
        - message
        - operationId
        - currentRecord
      properties:
        code:
          type: string
          enum:
            - RECORD_ALREADY_EXISTS
        message:
          type: string
          minLength: 1
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        currentRecord:
          $ref: '#/components/schemas/Models.TechnicalRecord'
      unevaluatedProperties:
        not: {}
      description: Creation failed because the technical record already exists.
    Models.RecordIdentifierRetiredError:
      type: object
      required:
        - code
        - message
        - operationId
        - recordId
      properties:
        code:
          type: string
          enum:
            - RECORD_IDENTIFIER_RETIRED
        message:
          type: string
          minLength: 1
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
      unevaluatedProperties:
        not: {}
      description: Creation failed because the stable record identifier was retired by an accepted deletion.
    Models.RecordNotFoundError:
      type: object
      required:
        - code
        - message
        - operationId
        - recordId
      properties:
        code:
          type: string
          enum:
            - RECORD_NOT_FOUND
        message:
          type: string
          minLength: 1
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
      unevaluatedProperties:
        not: {}
      description: The operation targets a technical record that does not exist.
    Models.RecordOperationResult:
      type: object
      required:
        - outcome
        - operationId
        - record
        - sequence
      properties:
        outcome:
          type: string
          enum:
            - accepted
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        record:
          $ref: '#/components/schemas/Models.TechnicalRecord'
        sequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: The stable result returned when a create or replacement is accepted or replayed identically.
    Models.RecordTechnicalChange:
      type: object
      required:
        - operationId
        - record
        - sequence
      properties:
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        record:
          $ref: '#/components/schemas/Models.TechnicalRecord'
        sequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: One accepted live-record change in monotonic server-sequence order.
    Models.ReplaceTechnicalRecordOperation:
      type: object
      required:
        - operationId
        - recordId
        - value
        - kind
        - expectedRevision
      properties:
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
          description: The stable operation and idempotency identifier.
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        value:
          type: string
        kind:
          type: string
          enum:
            - replace
        expectedRevision:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: Replace a technical record at its expected server revision.
    Models.RevisionConflictError:
      type: object
      required:
        - code
        - message
        - operationId
        - expectedRevision
        - currentRecord
      properties:
        code:
          type: string
          enum:
            - REVISION_CONFLICT
        message:
          type: string
          minLength: 1
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        expectedRevision:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        currentRecord:
          $ref: '#/components/schemas/Models.TechnicalRecord'
      unevaluatedProperties:
        not: {}
      description: Replacement failed because the expected and current revisions differ.
    Models.ServerAccessMode:
      type: string
      enum:
        - single-user-no-auth
        - single-user-auth
        - multi-user-auth
    Models.ServerCapabilities:
      type: object
      required:
        - contractVersion
        - serverInstanceId
        - accessMode
        - supportedBoundaries
        - anchoredSnapshots
      properties:
        contractVersion:
          type: string
          enum:
            - '1'
        serverInstanceId:
          $ref: '#/components/schemas/Models.ServerInstanceId'
        accessMode:
          $ref: '#/components/schemas/Models.ServerAccessMode'
        supportedBoundaries:
          type: array
          items:
            type: string
            enum:
              - g2
              - generation
          minItems: 1
          maxItems: 2
          uniqueItems: true
        anchoredSnapshots:
          type: boolean
      unevaluatedProperties:
        not: {}
    Models.ServerInstanceId:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      format: uuid
      description: A stable, non-secret server installation identity.
    Models.SnapshotContinuationPage:
      type: object
      required:
        - reconciliationId
        - generation
        - anchorSequence
        - entries
        - hasMore
        - nextCursor
      properties:
        reconciliationId:
          $ref: '#/components/schemas/Models.ReconciliationId'
        generation:
          $ref: '#/components/schemas/Models.SyncGeneration'
        anchorSequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Models.SnapshotEntry'
        hasMore:
          type: boolean
          enum:
            - true
        nextCursor:
          $ref: '#/components/schemas/Models.SnapshotCursor'
      unevaluatedProperties:
        not: {}
      description: A non-final page from one immutable anchored snapshot.
    Models.SnapshotCursor:
      type: string
      minLength: 1
      description: An opaque, non-empty cursor bound to one anchored snapshot session.
    Models.SnapshotEntry:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Models.LiveSnapshotEntry'
        - $ref: '#/components/schemas/Models.TombstoneSnapshotEntry'
      discriminator:
        propertyName: kind
        mapping:
          record: '#/components/schemas/Models.LiveSnapshotEntry'
          tombstone: '#/components/schemas/Models.TombstoneSnapshotEntry'
      description: One entry in a complete anchored server snapshot.
    Models.SnapshotExpiredError:
      type: object
      required:
        - code
        - message
        - reconciliationId
      properties:
        code:
          type: string
          enum:
            - SNAPSHOT_EXPIRED
        message:
          type: string
          minLength: 1
        reconciliationId:
          $ref: '#/components/schemas/Models.ReconciliationId'
      unevaluatedProperties:
        not: {}
      description: The anchored snapshot session or cursor has expired.
    Models.SnapshotFinalPage:
      type: object
      required:
        - reconciliationId
        - generation
        - anchorSequence
        - entries
        - hasMore
        - incrementalCursor
      properties:
        reconciliationId:
          $ref: '#/components/schemas/Models.ReconciliationId'
        generation:
          $ref: '#/components/schemas/Models.SyncGeneration'
        anchorSequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Models.SnapshotEntry'
        hasMore:
          type: boolean
          enum:
            - false
        incrementalCursor:
          $ref: '#/components/schemas/Models.SyncCursor'
      unevaluatedProperties:
        not: {}
      description: The final snapshot page and the opaque incremental cursor positioned after its anchor.
    Models.SnapshotPage:
      anyOf:
        - $ref: '#/components/schemas/Models.SnapshotContinuationPage'
        - $ref: '#/components/schemas/Models.SnapshotFinalPage'
      description: One page from an internally consistent anchored snapshot.
    Models.StartReconciliationFromState:
      type: object
      required:
        - previousGeneration
        - previousCursor
      properties:
        previousGeneration:
          $ref: '#/components/schemas/Models.SyncGeneration'
        previousCursor:
          $ref: '#/components/schemas/Models.SyncCursor'
      unevaluatedProperties:
        not: {}
      description: Start a full reconciliation from one matching generation and cursor pair.
    Models.StartReconciliationRequest:
      anyOf:
        - $ref: '#/components/schemas/Models.StartReconciliationWithoutState'
        - $ref: '#/components/schemas/Models.StartReconciliationFromState'
      description: Start a full reconciliation either without state or from one complete persisted boundary.
    Models.StartReconciliationWithoutState:
      type: object
      unevaluatedProperties:
        not: {}
      description: Start a full reconciliation without previously persisted synchronization state.
    Models.SyncCursor:
      type: string
      minLength: 1
      description: An opaque, non-empty incremental synchronization cursor.
    Models.SyncGeneration:
      type: string
      minLength: 1
      description: An opaque, non-empty synchronization-generation identifier controlled by the server.
    Models.SynchronizationBootstrap:
      type: object
      required:
        - contractVersion
        - serverInstanceId
        - identity
        - population
        - boundary
        - expectation
      properties:
        contractVersion:
          type: string
          enum:
            - '1'
        serverInstanceId:
          $ref: '#/components/schemas/Models.ServerInstanceId'
        identity:
          $ref: '#/components/schemas/Models.AuthorizedScopeIdentity'
        population:
          type: string
          enum:
            - empty
            - populated
        boundary:
          $ref: '#/components/schemas/Models.SynchronizationBoundary'
        expectation:
          $ref: '#/components/schemas/Models.ExchangeExpectation'
      unevaluatedProperties:
        not: {}
    Models.SynchronizationBoundary:
      anyOf:
        - $ref: '#/components/schemas/Models.G2SynchronizationBoundary'
        - $ref: '#/components/schemas/Models.GenerationSynchronizationBoundary'
    Models.SynchronizationScopeId:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      format: uuid
      description: A server-owned synchronization partition identity; never a credential.
    Models.SynchronizationUnavailableError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - SYNCHRONIZATION_UNAVAILABLE
        message:
          type: string
          enum:
            - The synchronization service is unavailable.
      unevaluatedProperties:
        not: {}
      description: Temporary synchronization persistence unavailability. Retry unchanged work within the bounded retry budget.
    Models.TechnicalChange:
      anyOf:
        - $ref: '#/components/schemas/Models.RecordTechnicalChange'
        - $ref: '#/components/schemas/Models.TombstoneTechnicalChange'
      description: One accepted server change in monotonic server-sequence order.
    Models.TechnicalRecord:
      type: object
      required:
        - recordId
        - revision
        - value
      properties:
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        revision:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        value:
          type: string
      unevaluatedProperties:
        not: {}
      description: The deliberately technical record used to validate the synchronization mechanism.
    Models.TechnicalRecordOperation:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Models.CreateTechnicalRecordOperation'
        - $ref: '#/components/schemas/Models.ReplaceTechnicalRecordOperation'
        - $ref: '#/components/schemas/Models.DeleteTechnicalRecordOperation'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/Models.CreateTechnicalRecordOperation'
          replace: '#/components/schemas/Models.ReplaceTechnicalRecordOperation'
          delete: '#/components/schemas/Models.DeleteTechnicalRecordOperation'
      description: One stable technical-record operation submitted for synchronization.
    Models.TechnicalTombstone:
      type: object
      required:
        - recordId
        - revision
        - deletedAtSequence
      properties:
        recordId:
          $ref: '#/components/schemas/Models.Uuid'
        revision:
          $ref: '#/components/schemas/Models.PositiveDecimal'
        deletedAtSequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: The retained synchronization representation of an accepted deletion.
    Models.TombstoneOperationResult:
      type: object
      required:
        - outcome
        - operationId
        - tombstone
        - sequence
      properties:
        outcome:
          type: string
          enum:
            - accepted
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        tombstone:
          $ref: '#/components/schemas/Models.TechnicalTombstone'
        sequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: The stable result returned when a deletion is accepted or replayed identically.
    Models.TombstoneSnapshotEntry:
      type: object
      required:
        - kind
        - tombstone
      properties:
        kind:
          type: string
          enum:
            - tombstone
        tombstone:
          $ref: '#/components/schemas/Models.TechnicalTombstone'
      unevaluatedProperties:
        not: {}
      description: A retained deletion in an anchored snapshot.
    Models.TombstoneTechnicalChange:
      type: object
      required:
        - operationId
        - tombstone
        - sequence
      properties:
        operationId:
          $ref: '#/components/schemas/Models.Uuid'
        tombstone:
          $ref: '#/components/schemas/Models.TechnicalTombstone'
        sequence:
          $ref: '#/components/schemas/Models.PositiveDecimal'
      unevaluatedProperties:
        not: {}
      description: One accepted deletion in monotonic server-sequence order.
    Models.Uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      format: uuid
      description: A canonical lowercase UUID identifier.
